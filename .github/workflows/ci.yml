name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: bash -n scripts/start.sh scripts/worker.sh scripts/retention_loop.sh scripts/mac_worker.sh scripts/backup_database.sh scripts/restore_database.sh
      - run: docker build --tag devdna:ci .
      - run: docker build --tag devdna-worker:ci --file Dockerfile.worker .

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devdna
          POSTGRES_USER: devdna
          POSTGRES_PASSWORD: devdna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devdna"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DEVDNA_ENVIRONMENT: test
      DEVDNA_DATABASE_URL: postgresql+asyncpg://devdna:devdna@localhost:5432/devdna
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --dev
      - run: uv run alembic upgrade head
      - run: uv run alembic check
