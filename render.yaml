services:
  # FastAPI + web UI. Runs migrations, then uvicorn.
  - type: web
    name: devdna-api
    runtime: docker
    repo: https://github.com/dgexplores/DevDNAv2.git
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: DEVDNA_ENVIRONMENT
        value: production
      - key: DEVDNA_DATABASE_URL
        sync: false
      - key: DEVDNA_REDIS_URL
        sync: false
      - key: DEVDNA_LOG_LEVEL
        value: INFO
      - key: DEVDNA_API_KEYS
        sync: false
      - key: DEVDNA_WEB_SESSION_SECRET
        sync: false
      - key: DEVDNA_GITHUB_TOKEN
        sync: false
      - key: DEVDNA_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: DEVDNA_CLERK_SECRET_KEY
        sync: false
      - key: DEVDNA_CLERK_JWKS_URL
        sync: false
      - key: DEVDNA_CLERK_ISSUER
        sync: false
      - key: DEVDNA_CLERK_WEBHOOK_SECRET
        sync: false
