name: devdna

services:
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DEVDNA_ENVIRONMENT: ${DEVDNA_ENVIRONMENT:-development}
      DEVDNA_DATABASE_URL: postgresql+asyncpg://devdna:devdna@postgres:5432/devdna
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      DEVDNA_ENVIRONMENT: ${DEVDNA_ENVIRONMENT:-development}
      DEVDNA_DATABASE_URL: postgresql+asyncpg://devdna:devdna@postgres:5432/devdna
      DEVDNA_REDIS_URL: redis://redis:6379/0
      DEVDNA_API_KEYS: ${DEVDNA_API_KEYS:-}
      DEVDNA_WEB_SESSION_SECRET: ${DEVDNA_WEB_SESSION_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: rq worker devdna --with-scheduler --url redis://redis:6379/0
    environment:
      DEVDNA_ENVIRONMENT: ${DEVDNA_ENVIRONMENT:-development}
      DEVDNA_DATABASE_URL: postgresql+asyncpg://devdna:devdna@postgres:5432/devdna
      DEVDNA_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  retention:
    profiles: ["maintenance"]
    build: .
    command: python -m devdna.retention
    environment:
      DEVDNA_ENVIRONMENT: ${DEVDNA_ENVIRONMENT:-development}
      DEVDNA_DATABASE_URL: postgresql+asyncpg://devdna:devdna@postgres:5432/devdna
      DEVDNA_ANALYSIS_RETENTION_DAYS: ${DEVDNA_ANALYSIS_RETENTION_DAYS:-90}
      DEVDNA_RETENTION_BATCH_SIZE: ${DEVDNA_RETENTION_BATCH_SIZE:-500}
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devdna
      POSTGRES_USER: devdna
      POSTGRES_PASSWORD: devdna
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdna"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
